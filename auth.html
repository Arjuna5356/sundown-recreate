<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Sundown Studio</title>
    <meta name="description" content="Sign in or create your Sundown Studio account with Google.">
    <link rel="shortcut icon" href="assets/icons/icon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="theme-dark">
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <header id="header" class="liquid-glass-header">
        <div class="liquid-navbar-chassis">
            <a href="index.html" class="liquid-brand-logo" aria-label="Sundown Studio Home">
                <img src="assets/icons/logo-white.svg" alt="Sundown Studio">
            </a>
            <nav class="liquid-nav-links" aria-label="Primary Navigation">
                <a href="index.html" class="liquid-nav-item" data-nav-page="home">Home</a>
                <a href="work.html" class="liquid-nav-item" data-nav-page="work">Work</a>
                <a href="studio.html" class="liquid-nav-item" data-nav-page="studio">Studio</a>
                <a href="services.html" class="liquid-nav-item" data-nav-page="services">Services</a>
                <a href="contact.html" class="liquid-nav-item" data-nav-page="contact">Contact</a>
            </nav>
            <a href="contact.html" class="liquid-cta-btn">
                <span>Start a Project</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            <button class="liquid-mobile-toggle" aria-expanded="false" aria-label="Toggle Navigation Menu">
                <svg class="icon-hamburger" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <svg class="icon-close" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="liquid-mobile-dropdown">
            <nav class="liquid-mobile-nav" aria-label="Mobile Navigation">
                <a href="index.html" class="liquid-mobile-link" data-nav-page="home">Home</a>
                <a href="work.html" class="liquid-mobile-link" data-nav-page="work">Work</a>
                <a href="studio.html" class="liquid-mobile-link" data-nav-page="studio">Studio</a>
                <a href="services.html" class="liquid-mobile-link" data-nav-page="services">Services</a>
                <a href="contact.html" class="liquid-mobile-link" data-nav-page="contact">Contact</a>
            </nav>
            <div style="margin-top: 1rem; width: 100%;">
                <a href="contact.html" class="liquid-cta-btn" style="width: 100%; justify-content: center;">Start a Project</a>
            </div>
        </div>
    </header>

    <main id="main-content" class="auth-page">
        <section class="auth-card" aria-labelledby="auth-title">
            <span class="section-badge">SUNDOWN STUDIO</span>
            <div id="sign-in-panel">
                <h1 id="auth-title">Welcome in.</h1>
                <p>Sign in with Google, or create your account on your first visit.</p>
                <button id="google-sign-in" class="google-sign-in-button" type="button">
                    <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"/>
                        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4 1.9-6.8 1.9-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44z"/>
                        <path fill="#FBBC05" d="M12.8 27.7a12 12 0 0 1 0-7.4V15H5.9a20 20 0 0 0 0 18z"/>
                        <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.9-5.9A19.7 19.7 0 0 0 24 4 20 20 0 0 0 5.9 15l6.9 5.3c1.6-4.7 6-8.2 11.2-8.2z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
            <div id="account-panel" class="auth-account" hidden>
                <img id="user-photo" class="auth-user-photo" alt="" hidden>
                <h2 id="user-name"></h2>
                <p id="user-email"></p>
                <button id="sign-out" class="auth-sign-out-button" type="button">Sign out</button>
            </div>
            <p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
        </section>
    </main>

    <script src="js/navigation.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
